name: Collect Face PNG Filter package
description: Collect the installer ZIP produced by the build script
inputs:
  target:
    required: true
    description: Architecture
  config:
    default: RelWithDebInfo
    description: Configuration
  package:
    default: 'false'
    description: Packaging flag
runs:
  using: composite
  steps:
    - name: Collect package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force release | Out-Null
        Copy-Item dist/face-png-filter-*-windows-x64.zip release/
